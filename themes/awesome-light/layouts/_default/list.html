{{ define "main" }}
<div class="site">
  {{ partial "page-sidebar.html" . }}

  <main class="content">
    <article class="page-prose">
      <h1>{{ .Title }}</h1>
      {{ .Content }}

      {{ with .Pages }}
      <ul class="page-children">
        {{ range . }}
        <li>
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
          {{ with .Params.summary }}<span class="page-children-summary">{{ . }}</span>{{ end }}
        </li>
        {{ end }}
      </ul>
      {{ end }}
    </article>
  </main>
</div>
{{ end }}
