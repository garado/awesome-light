name: Add submission

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  open-pr:
    if: startsWith(github.event.issue.title, '[Submission]:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue and open PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            // Issue forms render each field as "### Label\n\nvalue"
            function field(label) {
              const re = new RegExp(`### ${label}\\s*\\n\\s*([^\\n]*(?:\\n(?!### )[^\\n]*)*)`, "i");
              const match = body.match(re);
              if (!match) return "";
              const value = match[1].trim();
              return value === "_No response_" ? "" : value;
            }

            const name = field("App name");
            const repoUrl = field("Repository URL").replace(/\/+$/, "");
            const downloadUrl = repoUrl ? `${repoUrl}/releases` : "";
            const author = context.payload.issue.user.login;
            const category = field("Category");
            const description = field("Short description");
            const longDescription = field("Long description");
            const screenshotLines = field("Screenshots")
              .split("\n")
              .map((s) => s.trim())
              .filter(Boolean);
            const lightSdk = field("Built with the Light SDK?") === "Yes";

            // Accept either a raw URL per line or markdown image syntax: ![alt](url)
            function extractUrl(line) {
              const md = line.match(/!\[[^\]]*\]\(([^)]+)\)/);
              return (md ? md[1] : line).trim();
            }

            // gh "blob" view URLs point at an HTML page, not raw bytes
            function toRawUrl(url) {
              const m = url.match(
                /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/([^/]+)\/(.+)$/
              );
              return m ? `https://raw.githubusercontent.com/${m[1]}/${m[2]}/${m[3]}/${m[4]}` : url;
            }

            const screenshots = screenshotLines.map(extractUrl).map(toRawUrl);

            const missing = [];
            if (!name) missing.push("App name");
            if (!repoUrl) missing.push("Repository URL");
            if (!category) missing.push("Category");
            if (!description) missing.push("Short description");
            if (screenshots.length === 0) missing.push("Screenshots");

            if (missing.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Couldn't parse this submission - missing or unreadable field(s): ${missing.join(", ")}. Please edit the issue using the submission form fields and it will retry automatically.`,
              });
              return;
            }

            const slug = name
              .toLowerCase()
              .trim()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-+|-+$/g, "");
            const dirName = `${author}_${slug}`;
            const entryPath = `content/apps/${dirName}/index.md`;

            const { data: existing } = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "content/apps",
              ref: "main",
            }).catch(() => ({ data: [] }));

            if (Array.isArray(existing) && existing.some((e) => e.name === dirName)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `It looks like **${name}** by **${author}** is already on the list (\`${dirName}\`). If this is a mistake, let me know!`,
              });
              return;
            }

            const branch = `submission/issue-${context.issue.number}`;
            const { data: mainRef } = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "heads/main",
            });

            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/heads/${branch}`,
              sha: mainRef.object.sha,
            }).catch(() => {}); // branch may already exist on re-edit

            // Try to download each screenshot into the repo, but fall back to linking the external URL if the download fails.
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const imageRefs = [];
            const downloadFailures = [];

            for (let i = 0; i < screenshots.length; i++) {
              const url = screenshots[i];
              try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const buf = Buffer.from(await res.arrayBuffer());
                const ext = (url.split("?")[0].match(/\.[a-zA-Z0-9]+$/) || [".png"])[0].toLowerCase();
                const filename = `${letters[i] || `img${i}`}${ext}`;

                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: `content/apps/${dirName}/${filename}`,
                  message: `Add ${filename} for ${name}`,
                  content: buf.toString("base64"),
                  branch,
                });

                imageRefs.push(filename);
              } catch (err) {
                downloadFailures.push(url);
                imageRefs.push(url);
              }
            }

            const yamlStr = (s) => JSON.stringify(s);
            const dateAdded = new Date().toISOString().slice(0, 10);

            const frontmatterLines = [
              "---",
              `title: ${yamlStr(name)}`,
              `date_added: ${dateAdded}`,
              `repo: ${yamlStr(repoUrl)}`,
              `download: ${yamlStr(downloadUrl)}`,
              `author: ${yamlStr(author)}`,
              `author_url: ${yamlStr(`https://github.com/${author}`)}`,
              `category: ${yamlStr(category)}`,
            ];
            if (lightSdk) frontmatterLines.push("light_sdk: true");
            frontmatterLines.push(
              "images:",
              ...imageRefs.map((ref) => `  - ${yamlStr(ref)}`),
              `description: ${yamlStr(description)}`,
              "---",
              "",
            );

            const content = frontmatterLines.join("\n") + (longDescription ? `\n${longDescription}\n` : "");

            const existingFile = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: entryPath,
              ref: branch,
            }).catch(() => null);

            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: entryPath,
              message: `Add ${name} to the list`,
              content: Buffer.from(content).toString("base64"),
              sha: existingFile ? existingFile.data.sha : undefined,
              branch,
            });

            const existingPrs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${branch}`,
              state: "open",
            });

            if (existingPrs.data.length === 0) {
              const failureNote = downloadFailures.length
                ? `\n\nNote: couldn't download ${downloadFailures.length} screenshot(s), so they are linked externally instead of committed:\n${downloadFailures.map((u) => `- ${u}`).join("\n")}`
                : "";

              const { data: pr } = await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Add ${name}`,
                head: branch,
                base: "main",
                body: `Adds **${name}** to the list.\n\nCloses #${context.issue.number}${failureNote}`,
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Thanks for the submission! Opened #${pr.number} - a maintainer will review it shortly.${failureNote}`,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: `Updated #${existingPrs.data[0].number} with your latest edits.`,
              });
            }
